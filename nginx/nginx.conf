events {
    worker_connections 1024;
}

http {
    # ── Block all /internal/ routes ───────────────────────────────────────

    # Applied via deny in each server block below

    server {
        listen 80;
        server_name _;

        client_max_body_size 512M;

        # Docker's internal DNS — resolves upstream names at request time, not startup
        resolver 127.0.0.11 valid=10s;
        resolver_timeout 5s;

        # Never expose internal routes
        location ~ ^/.*/internal(/|$) {
            return 403;
        }
        location ~ ^/internal(/|$) {
            return 403;
        }

        # ── Auth service ─────────────────────────────────────────────────

        location = /auth/docs {
            set $upstream http://auth-service:8001;
            proxy_pass $upstream/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/auth/openapi.json'";
            sub_filter_once on;
        }
        location = /auth/redoc {
            set $upstream http://auth-service:8001;
            proxy_pass $upstream/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/auth/openapi.json'";
            sub_filter_once on;
        }
        location = /auth/openapi.json {
            set $upstream http://auth-service:8001;
            proxy_pass $upstream/openapi.json;
        }

        location /auth/ {
            set $upstream http://auth-service:8001;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Profile service ──────────────────────────────────────────────

        location = /profile/docs {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/profile/openapi.json'";
            sub_filter_once on;
        }
        location = /profile/redoc {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/profile/openapi.json'";
            sub_filter_once on;
        }
        location = /profile/openapi.json {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream/openapi.json;
        }

        location /profiles/ {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /creators/ {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /tiers/ {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /subscriptions/ {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /subscribers/ {
            set $upstream http://profile-service:8002;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Content service ──────────────────────────────────────────────

        location = /content/docs {
            set $upstream http://content-service:8003;
            proxy_pass $upstream/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/content/openapi.json'";
            sub_filter_once on;
        }
        location = /content/redoc {
            set $upstream http://content-service:8003;
            proxy_pass $upstream/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/content/openapi.json'";
            sub_filter_once on;
        }
        location = /content/openapi.json {
            set $upstream http://content-service:8003;
            proxy_pass $upstream/openapi.json;
        }

        location /posts/ {
            set $upstream http://content-service:8003;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /feed {
            set $upstream http://content-service:8003;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /media/ {
            set $upstream http://content-service:8003;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
