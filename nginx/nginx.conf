events {
    worker_connections 1024;
}

http {
    # ── Block all /internal/ routes ───────────────────────────────────────

    # Applied via deny in each server block below

    server {
        listen 80;
        server_name _;

        client_max_body_size 512M;

        # Never expose internal routes
        location ~ ^/.*/internal(/|$) {
            return 403;
        }
        location ~ ^/internal(/|$) {
            return 403;
        }

        # ── Auth service ─────────────────────────────────────────────────

        location = /auth/docs {
            proxy_pass http://auth-service:8001/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '"/openapi.json"' '"/auth/openapi.json"';
            sub_filter_once on;
        }
        location = /auth/redoc {
            proxy_pass http://auth-service:8001/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/auth/openapi.json'";
            sub_filter_once on;
        }
        location = /auth/openapi.json {
            proxy_pass http://auth-service:8001/openapi.json;
        }

        location /auth/ {
            proxy_pass http://auth-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Profile service ──────────────────────────────────────────────

        location = /profile/docs {
            proxy_pass http://profile-service:8002/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '"/openapi.json"' '"/profile/openapi.json"';
