        }

        # ── Payment service ──────────────────────────────────────────────

        location = /payment/docs {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '"/docs/openapi.yaml"' '"/payment/docs/openapi.yaml"';
            sub_filter_once on;
        }
        location = /payment/docs/openapi.yaml {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream/docs/openapi.yaml;
        }

        location /checkout {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /transactions {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /balance {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /payouts {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /revenue {
            set $upstream http://payment-service:8004;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
