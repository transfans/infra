events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        client_max_body_size 512M;

        # Docker's internal DNS — resolves upstream names at request time, not startup
        resolver 127.0.0.11 valid=10s;
        resolver_timeout 5s;

        # Never expose internal routes
        location ~ ^/.*/internal(/|$) {
            return 403;
        }
        location ~ ^/internal(/|$) {
            return 403;
        }

        # ── Auth service ─────────────────────────────────────────────────

        location = /auth/docs {
            set $svc auth-service:8001;
            proxy_pass http://$svc/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/auth/openapi.json'";
            sub_filter_once on;
        }
        location = /auth/redoc {
            set $svc auth-service:8001;
            proxy_pass http://$svc/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/auth/openapi.json'";
            sub_filter_once on;
        }
        location = /auth/openapi.json {
            set $svc auth-service:8001;
            proxy_pass http://$svc/openapi.json;
        }

        location /auth {
            set $svc auth-service:8001;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Profile service ──────────────────────────────────────────────

        location = /profile/docs {
            set $svc profile-service:8002;
            proxy_pass http://$svc/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/profile/openapi.json'";
            sub_filter_once on;
        }
        location = /profile/redoc {
            set $svc profile-service:8002;
            proxy_pass http://$svc/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/profile/openapi.json'";
            sub_filter_once on;
        }
        location = /profile/openapi.json {
            set $svc profile-service:8002;
            proxy_pass http://$svc/openapi.json;
        }

        location /profiles {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /creators {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /tiers {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /subscriptions {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /metrics {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /analytics {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /subscribers {
            set $svc profile-service:8002;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Content service ──────────────────────────────────────────────

        location = /content/docs {
            set $svc content-service:8003;
            proxy_pass http://$svc/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/content/openapi.json'";
            sub_filter_once on;
        }
        location = /content/redoc {
            set $svc content-service:8003;
            proxy_pass http://$svc/redoc;
            proxy_set_header Accept-Encoding "";
            sub_filter "'/openapi.json'" "'/content/openapi.json'";
            sub_filter_once on;
        }
        location = /content/openapi.json {
            set $svc content-service:8003;
            proxy_pass http://$svc/openapi.json;
        }

        location /posts {
            set $svc content-service:8003;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /feed {
            set $svc content-service:8003;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /media {
            set $svc content-service:8003;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Payment service ──────────────────────────────────────────────

        location = /payment/docs {
            set $svc payment-service:8004;
            proxy_pass http://$svc/docs;
            proxy_set_header Accept-Encoding "";
            sub_filter '"/docs/openapi.yaml"' '"/payment/docs/openapi.yaml"';
            sub_filter_once on;
        }
        location = /payment/docs/openapi.yaml {
            set $svc payment-service:8004;
            proxy_pass http://$svc/docs/openapi.yaml;
        }

        location /checkout {
            set $svc payment-service:8004;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /transactions {
            set $svc payment-service:8004;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /balance {
            set $svc payment-service:8004;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /payouts {
            set $svc payment-service:8004;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /revenue {
            set $svc payment-service:8004;
            proxy_pass http://$svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
